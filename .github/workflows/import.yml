name: Import MindBalance project

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import.yml'

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install PHP and Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli python3
      - name: Fetch original team project
        run: git clone --depth 1 https://github.com/M1sh13l/MindBalance-Web-App.git /tmp/mindbalance-source
      - name: Build sanitized project and lint PHP
        run: python3 scripts/import_project.py /tmp/mindbalance-source "$GITHUB_WORKSPACE"
      - name: Commit imported project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add MindBalance application and sanitized schema"
            git push origin HEAD:main
          fi
